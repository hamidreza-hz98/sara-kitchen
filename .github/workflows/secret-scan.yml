name: Secret scan

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      MONGODB_URI: mongodb://127.0.0.1:27017/sara-kitchen-ci
      AUTH_SESSION_SECRET: ci-session-canary-A7vQ2mN9xK4pR8sT6wY3zB5dF1hJ
      AUTH_PASSWORD_RESET_SECRET: ci-reset-canary-N4qW8mZ2yK7rT5vP9xC3bD6fH1jL
      RESET_SMS_ENABLED: "false"
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ci-minio-canary-access
      MINIO_SECRET_KEY: ci-minio-canary-V8qN2xR7mT4zK9pW6yB3dF5h
      MINIO_BUCKET: sara-kitchen-ci
      MINIO_REGION: us-east-1
      KITCHEN_LATITUDE: "41.1579"
      KITCHEN_LONGITUDE: "-8.6291"
      MBWAY_ENABLED: "false"
      WHATSAPP_ENABLED: "false"
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production output with non-operational canaries
        run: pnpm build

      - name: Scan history, worktree, and deployable output
        run: pnpm secrets:scan
